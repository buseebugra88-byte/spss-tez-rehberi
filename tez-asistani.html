<style>:root{
  --fz:1;
  --bg:#f6f4ef; --panel:#fffdf9; --ink:#1d1c1a; --ink2:#55524c; --muted:#8a867e; --line:#e3ded3; --line2:#efebe3;
  --acc:#1f5f63; --acc2:#2c7d80; --accbg:#e4f0ef; --warn:#a45a00; --warnbg:#fbefdc; --bad:#a83232; --badbg:#f8e3e1; --ok:#2f6b2f; --okbg:#e5f1e2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --r:12px; --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 14px rgba(30,25,15,.05);
  --f-head:'Fraunces',Georgia,serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(14.5px*var(--fz));line-height:1.5}
a{color:var(--acc)} h1,h2,h3{font-family:var(--f-head);font-weight:600;letter-spacing:-.01em;margin:0 0 .4em} h1{font-size:calc(26px*var(--fz))} h2{font-size:calc(20px*var(--fz))} h3{font-size:calc(16px*var(--fz))}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#1b3436;color:#e8efee;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--f-head);font-size:calc(19px*var(--fz));line-height:1.15;padding:4px 10px 14px;border-bottom:1px solid #ffffff1f;margin-bottom:10px}
.brand small{display:block;font-family:var(--f-body);font-size:calc(11.5px*var(--fz));color:#a9c3c1;margin-top:4px;letter-spacing:.02em}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#d6e4e2;text-decoration:none;font-size:calc(14px*var(--fz));margin:1px 0}
.nav a:hover{background:#ffffff12} .nav a.on{background:#ffffff22;color:#fff;font-weight:500}
.nav .sec{font-size:calc(10.5px*var(--fz));text-transform:uppercase;letter-spacing:.12em;color:#8fb0ad;margin:14px 10px 4px}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.9}
.main{padding:26px 30px 80px;max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top p{margin:2px 0 0;color:var(--ink2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin-bottom:10px}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:calc(12px*var(--fz));color:var(--ink2)} .kpi .v{font-family:var(--f-head);font-size:calc(28px*var(--fz));line-height:1.1;margin-top:2px} .kpi .s{font-size:calc(12px*var(--fz));color:var(--muted)}
.btn{text-decoration:none;font:inherit;font-size:calc(13.5px*var(--fz));border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:#c9c2b4} .btn.p{background:var(--acc);border-color:var(--acc);color:#fff} .btn.p:hover{background:var(--acc2)}
.btn.d{color:var(--bad)} .btn.sm{padding:4px 9px;font-size:calc(12.5px*var(--fz))} .btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .sp{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:calc(12.5px*var(--fz));color:var(--ink2)}
input,select,textarea{font:inherit;font-size:calc(14px*var(--fz));border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #2c7d8055;border-color:var(--acc2)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:calc(14px*var(--fz));color:var(--ink)} .chk input{margin-top:3px;flex:none}
table{border-collapse:collapse;width:100%;font-size:calc(13.5px*var(--fz))} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:calc(12.5px*var(--fz));background:#faf8f3;position:sticky;top:0} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:#f7f5ef}
.tbl{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
.tag{display:inline-block;font-size:calc(11.5px*var(--fz));padding:1px 8px;border-radius:20px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.w{background:var(--warnbg);color:var(--warn)} .tag.b{background:var(--badbg);color:var(--bad)} .tag.a{background:var(--accbg);color:var(--acc)}
.tag.ex{background:#e3eefb;color:#1e5aa6} .tag.ko{background:#fde9df;color:#a8431a}
.note{background:var(--accbg);border-radius:10px;padding:10px 12px;font-size:calc(13px*var(--fz));color:#174a4d;margin:8px 0}
.note.w{background:var(--warnbg);color:#6f3d00} .note.b{background:var(--badbg);color:#7a1f1f}
.muted{color:var(--muted)} .small{font-size:calc(12.5px*var(--fz))} .mono{font-family:var(--f-mono);font-size:calc(12.5px*var(--fz))}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{font:inherit;border:0;background:none;padding:9px 12px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:calc(13.5px*var(--fz))}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:500}
.bar{height:8px;border-radius:6px;background:var(--line2);overflow:hidden} .bar>span{display:block;height:100%;background:var(--acc)}
.cell{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:#fff}
.cell .v{font-family:var(--f-head);font-size:calc(22px*var(--fz))}
.out{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.out p{margin:.4em 0} .para{background:#fbfaf6;border-left:3px solid var(--acc);padding:10px 12px;border-radius:6px;font-size:calc(14px*var(--fz));margin-top:10px}
pre.code{background:#16292a;color:#d7ecea;padding:12px 14px;border-radius:10px;overflow:auto;font-family:var(--f-mono);font-size:calc(12px*var(--fz));max-height:420px;white-space:pre}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b3436;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:calc(13.5px*var(--fz));box-shadow:0 6px 20px #0003}
.modal{position:fixed;inset:0;background:#1b343688;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border-radius:14px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.vas{position:relative;height:56px;margin:10px 4px} .vas input{width:100%}
.odi-q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.odi-q b{display:block;margin-bottom:6px} .odi-q label{display:flex;gap:8px;padding:4px 0;font-size:calc(14px*var(--fz));cursor:pointer}
.canvaswrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:auto;background:#111;max-height:72vh}
.canvaswrap canvas{display:block;cursor:crosshair}
.legend{display:flex;gap:14px;font-size:calc(12.5px*var(--fz));color:var(--ink2);flex-wrap:wrap} .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
svg text{font-family:var(--f-body)} .chart{width:100%;height:auto;overflow:visible}
.tip{position:fixed;pointer-events:none;background:#1d1c1a;color:#fff;font-size:calc(12px*var(--fz));padding:6px 8px;border-radius:6px;z-index:80;white-space:pre}
.patient{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto;padding:28px 18px}
.patient .inner{max-width:720px;margin:0 auto;font-size:calc(17px*var(--fz))} .patient .odi-q label{font-size:calc(16.5px*var(--fz));padding:7px 0}
.flow{width:100%;max-width:880px}
.steps{counter-reset:s} .steps li{margin:6px 0}
.mnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr} .side{display:none} .main{padding:16px 14px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr} .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#1b3436;z-index:40;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{color:#d6e4e2;text-decoration:none;font-size:calc(11px*var(--fz));padding:6px 9px;display:flex;flex-direction:column;align-items:center;min-width:64px} .mnav a.on{color:#fff;background:#ffffff1c;border-radius:8px}
  .mnav i{font-style:normal;font-size:calc(17px*var(--fz))}
}
@media (max-width:560px){ .g2,.g3,.g4{grid-template-columns:1fr} h1{font-size:calc(22px*var(--fz))} }
@media print{ .side,.mnav,.btn,.tabs{display:none!important} .app{display:block} .card{box-shadow:none;break-inside:avoid} }
</style></head><body><div id="app" class="app"></div>

const PY_TEMPLATE="# -*- coding: utf-8 -*-\n\"\"\"\nmultifidus_unet.py  -  Multifidus Tez Asistani tarafindan uretildi.\n\nLumbar multifidus (LM) icin B-mod ultrason segmentasyonu: U-Net / U-Net++,\nkatilimci duzeyinde 5-kat capraz dogrulama + bagimsiz test seti.\nEtik kurul protokolundeki yontemle uyumlu: Dice+BCE kaybi, Adam, erken durdurma,\nyalnizca egitim verisine veri artirma, metrikler DSC, IoU, precision, recall, HD95.\n\nKLASOR YAPISI\n  VERI/B-mode/S-001_T0_ist_01.png      (ham goruntu)\n  VERI/mask/S-001_T0_ist_01.png        (ayni ad; LM=255 ya da 1, arka plan=0)\n  fold_atamalari.csv                    (uygulama > Faz 1 > Veri ayirma)\n\nKURULUM\n  pip install torch torchvision segmentation-models-pytorch pandas pillow scipy\n\nKULLANIM\n  python multifidus_unet.py --veri VERI --folds fold_atamalari.csv\n  python multifidus_unet.py --veri VERI --folds fold_atamalari.csv --ogrenme_egrisi 10,20,30,40\n\nCIKTILAR (sonuclar/ klasoru)\n  segmentasyon_metrikleri.csv  -> uygulama > Faz 1 > Segmentasyon metrikleri > CSV ice aktar\n  otomatik_olcumler.csv        -> uygulama > Faz 1 > Otomatik olcumleri ice aktar (H2)\n  ogrenme_egrisi.csv           -> uygulama > Faz 1 > Ogrenme egrisi\n  tahmin_maske/                -> modelin maskeleri (ayni dosya adlariyla)\n  model_final.pt\n\"\"\"\nimport argparse, os, random, math\nimport numpy as np\nimport pandas as pd\nfrom PIL import Image\nfrom scipy import ndimage\n\nPXMM_VARSAYILAN = __PXMM__        # piksel/mm (0 = mm cinsinden metrik verme)\nEKRAN_SOLU_HASTA_SAGI = True      # transvers goruntude ekranin solu hastanin sagi mi?\n\n\n# ----------------------------------------------------------------------------- yardimcilar\ndef katilimci_kodu(dosya):\n    return os.path.basename(dosya).split(\"_\")[0]\n\n\ndef maske_oku(yol):\n    m = np.array(Image.open(yol).convert(\"L\"))\n    return (m > 0).astype(np.uint8)\n\n\ndef gri_oku(yol):\n    return np.array(Image.open(yol).convert(\"L\")).astype(np.float32)\n\n\ndef yuzey(m):\n    m = m.astype(bool)\n    if not m.any():\n        return m\n    return m & ~ndimage.binary_erosion(m, border_value=0)\n\n\ndef metrikler(gt, pr, pxmm=0.0):\n    \"\"\"gt, pr: 0/1 numpy dizileri (ayni boyut). DSC, IoU, precision, recall, HD95.\"\"\"\n    gt = gt.astype(bool); pr = pr.astype(bool)\n    tp = np.logical_and(gt, pr).sum(); fp = np.logical_and(~gt, pr).sum(); fn = np.logical_and(gt, ~pr).sum()\n    dice = 2 * tp / (2 * tp + fp + fn) if (2 * tp + fp + fn) else 1.0\n    iou = tp / (tp + fp + fn) if (tp + fp + fn) else 1.0\n    prec = tp / (tp + fp) if (tp + fp) else 0.0\n    rec = tp / (tp + fn) if (tp + fn) else 0.0\n    sg, sp = yuzey(gt), yuzey(pr)\n    if sg.any() and sp.any():\n        dg = ndimage.distance_transform_edt(~sg)   # her pikselin gt yuzeyine uzakligi\n        dp = ndimage.distance_transform_edt(~sp)\n        hd = max(np.percentile(dg[sp], 95), np.percentile(dp[sg], 95))\n        if pxmm and pxmm > 0:\n            hd = hd / pxmm\n    else:\n        hd = float(\"nan\")\n    return dict(dice=dice, iou=iou, precision=prec, recall=rec, hd95=hd)\n\n\ndef taraf_olcumleri(maske, gri, pxmm):\n    \"\"\"Tek sinifli maskeyi sag/sol LM'ye ayirir; CSA (cm2) ve MGV hesaplar.\"\"\"\n    etiket, n = ndimage.label(maske)\n    w = maske.shape[1]\n    sol_ekran = np.zeros_like(maske, bool); sag_ekran = np.zeros_like(maske, bool)\n    for i in range(1, n + 1):\n        b = etiket == i\n        if b.sum() < 20:          # gurultu\n            continue\n        cx = np.nonzero(b)[1].mean()\n        if cx < w / 2:\n            sol_ekran |= b\n        else:\n            sag_ekran |= b\n    hasta_sag, hasta_sol = (sol_ekran, sag_ekran) if EKRAN_SOLU_HASTA_SAGI else (sag_ekran, sol_ekran)\n\n    def olc(b):\n        if not b.any():\n            return float(\"nan\"), float(\"nan\")\n        csa = b.sum() / (pxmm ** 2) / 100.0 if pxmm and pxmm > 0 else float(\"nan\")\n        return csa, float(gri[b].mean())\n    csa_r, mgv_r = olc(hasta_sag); csa_l, mgv_l = olc(hasta_sol)\n    return dict(csa_sag=csa_r, csa_sol=csa_l, mgv_sag=mgv_r, mgv_sol=mgv_l)\n\n\ndef veri_listesi(veri):\n    bdir, mdir = os.path.join(veri, \"B-mode\"), os.path.join(veri, \"mask\")\n    ok = (\".png\", \".jpg\", \".jpeg\", \".tif\", \".tiff\")\n    satir = []\n    for f in sorted(os.listdir(bdir)):\n        if not f.lower().endswith(ok):\n            continue\n        mp = os.path.join(mdir, os.path.splitext(f)[0] + \".png\")\n        if not os.path.exists(mp):\n            mp = os.path.join(mdir, f)\n        satir.append(dict(dosya=f, goruntu=os.path.join(bdir, f), maske=mp if os.path.exists(mp) else None, kod=katilimci_kodu(f)))\n    return pd.DataFrame(satir)\n\n\n# ----------------------------------------------------------------------------- PyTorch kismi\ndef egitim_bilesenleri():\n    import torch\n    import torch.nn as nn\n    import segmentation_models_pytorch as smp\n    return torch, nn, smp\n\n\nclass LMVeri:\n    def __init__(self, df, boyut, artir):\n        self.df = df.reset_index(drop=True); self.boyut = boyut; self.artir = artir\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, i):\n        import torch\n        r = self.df.iloc[i]\n        g = Image.open(r.goruntu).convert(\"L\"); m = Image.open(r.maske).convert(\"L\")\n        if self.artir:\n            aci = random.uniform(-10, 10); olcek = random.uniform(0.9, 1.1)\n            g = g.rotate(aci, resample=Image.BILINEAR); m = m.rotate(aci, resample=Image.NEAREST)\n            if olcek != 1:\n                W, H = g.size; nw, nh = int(W * olcek), int(H * olcek)\n                g2, m2 = g.resize((nw, nh), Image.BILINEAR), m.resize((nw, nh), Image.NEAREST)\n                g, m = Image.new(\"L\", (W, H)), Image.new(\"L\", (W, H))\n                g.paste(g2, ((W - nw) // 2, (H - nh) // 2)); m.paste(m2, ((W - nw) // 2, (H - nh) // 2))\n            if random.random() < 0.5:   # yatay yansitma (sag/sol LM ayni sinif)\n                g = g.transpose(Image.FLIP_LEFT_RIGHT); m = m.transpose(Image.FLIP_LEFT_RIGHT)\n        g = g.resize((self.boyut, self.boyut), Image.BILINEAR); m = m.resize((self.boyut, self.boyut), Image.NEAREST)\n        x = np.array(g, np.float32) / 255.0\n        if self.artir:\n            x = np.clip((x - 0.5) * random.uniform(0.85, 1.15) + 0.5 + random.uniform(-0.1, 0.1), 0, 1)\n        y = (np.array(m) > 0).astype(np.float32)\n        return torch.from_numpy(x)[None], torch.from_numpy(y)[None]\n\n\ndef model_kur(mimari, onegitim):\n    torch, nn, smp = egitim_bilesenleri()\n    agirlik = \"imagenet\" if onegitim else None\n    if mimari == \"unetpp\":\n        return smp.UnetPlusPlus(\"resnet34\", encoder_weights=agirlik, in_channels=1, classes=1)\n    if mimari == \"attunet\":   # Attention U-Net'e yakin secenek: scSE dikkat bloklu U-Net\n        return smp.Unet(\"resnet34\", encoder_weights=agirlik, in_channels=1, classes=1, decoder_attention_type=\"scse\")\n    return smp.Unet(\"resnet34\", encoder_weights=agirlik, in_channels=1, classes=1)\n\n\ndef tahmin(model, yol, boyut, cihaz):\n    torch, _, _ = egitim_bilesenleri()\n    g = Image.open(yol).convert(\"L\"); W, H = g.size\n    x = np.array(g.resize((boyut, boyut), Image.BILINEAR), np.float32) / 255.0\n    with torch.no_grad():\n        p = torch.sigmoid(model(torch.from_numpy(x)[None, None].to(cihaz)))[0, 0].cpu().numpy()\n    p = np.array(Image.fromarray((p * 255).astype(np.uint8)).resize((W, H), Image.BILINEAR)) / 255.0\n    return (p > 0.5).astype(np.uint8)\n\n\ndef egit(egitim_df, dogrulama_df, a, cihaz, epoch_sabit=None):\n    torch, nn, smp = egitim_bilesenleri()\n    from torch.utils.data import DataLoader\n    model = model_kur(a.mimari, a.onegitim).to(cihaz)\n    dice_kayip = smp.losses.DiceLoss(\"binary\"); bce = nn.BCEWithLogitsLoss()\n    opt = torch.optim.Adam(model.parameters(), lr=a.lr)\n    yukle = DataLoader(LMVeri(egitim_df, a.boyut, True), batch_size=a.batch, shuffle=True, num_workers=0)\n    en_iyi, en_iyi_ep, bekle, durum = -1, 0, 0, None\n    for ep in range(1, (epoch_sabit or a.epoch) + 1):\n        model.train()\n        for x, y in yukle:\n            x, y = x.to(cihaz), y.to(cihaz); opt.zero_grad()\n            out = model(x); kayip = dice_kayip(out, y) + bce(out, y); kayip.backward(); opt.step()\n        if epoch_sabit:\n            continue\n        model.eval()\n        d = np.mean([metrikler(maske_oku(r.maske), tahmin(model, r.goruntu, a.boyut, cihaz))[\"dice\"] for r in dogrulama_df.itertuples()])\n        if d > en_iyi:\n            en_iyi, en_iyi_ep, bekle = d, ep, 0\n            durum = {k: v.detach().clone() for k, v in model.state_dict().items()}\n        else:\n            bekle += 1\n            if bekle >= a.sabir:\n                break\n        print(f\"  epoch {ep:3d}  dogrulama Dice {d:.4f}  (en iyi {en_iyi:.4f} @ {en_iyi_ep})\")\n    if durum is not None:\n        model.load_state_dict(durum)\n    return model, en_iyi_ep, en_iyi\n\n\n# ----------------------------------------------------------------------------- ana akis\ndef main():\n    ap = argparse.ArgumentParser(description=\"Lumbar multifidus U-Net segmentasyonu\")\n    ap.add_argument(\"--veri\", required=True); ap.add_argument(\"--folds\", required=True)\n    ap.add_argument(\"--cikti\", default=\"sonuclar\"); ap.add_argument(\"--mimari\", default=\"unet\", choices=[\"unet\", \"unetpp\", \"attunet\"])\n    ap.add_argument(\"--boyut\", type=int, default=256); ap.add_argument(\"--epoch\", type=int, default=100)\n    ap.add_argument(\"--batch\", type=int, default=8); ap.add_argument(\"--lr\", type=float, default=1e-4)\n    ap.add_argument(\"--sabir\", type=int, default=15, help=\"erken durdurma sabri (epoch)\")\n    ap.add_argument(\"--pxmm\", type=float, default=PXMM_VARSAYILAN); ap.add_argument(\"--seed\", type=int, default=42)\n    ap.add_argument(\"--onegitim\", type=int, default=1, help=\"1: ImageNet on-egitimli kodlayici (internet gerekir)\")\n    ap.add_argument(\"--ogrenme_egrisi\", default=\"\", help=\"ornek: 10,20,30,40 (bagimsiz katilimci sayilari)\")\n    a = ap.parse_args()\n\n    torch, _, _ = egitim_bilesenleri()\n    random.seed(a.seed); np.random.seed(a.seed); torch.manual_seed(a.seed)\n    cihaz = \"cuda\" if torch.cuda.is_available() else (\"mps\" if getattr(torch.backends, \"mps\", None) and torch.backends.mps.is_available() else \"cpu\")\n    os.makedirs(os.path.join(a.cikti, \"tahmin_maske\"), exist_ok=True)\n\n    df = veri_listesi(a.veri)\n    eksik = df[df.maske.isna()]\n    if len(eksik):\n        print(f\"UYARI: {len(eksik)} goruntunun maskesi yok, cikarildi.\")\n    df = df[df.maske.notna()]\n    folds = pd.read_csv(a.folds); atama = dict(zip(folds.katilimci.astype(str), folds.altkume.astype(str)))\n    df[\"altkume\"] = df.kod.map(atama)\n    if df.altkume.isna().any():\n        print(\"UYARI: fold atamasi olmayan katilimcilar:\", sorted(df[df.altkume.isna()].kod.unique()))\n    df = df[df.altkume.notna()]\n    gelistirme, test = df[df.altkume != \"test\"], df[df.altkume == \"test\"]\n    k_listesi = sorted(gelistirme.altkume.unique())\n    print(f\"{df.kod.nunique()} katilimci, {len(df)} goruntu | gelistirme {len(gelistirme)} | test {len(test)} | cihaz {cihaz}\")\n\n    satirlar, olcumler, epoklar = [], [], []\n    # 1) katilimci duzeyinde capraz dogrulama (out-of-fold tahminler)\n    for k in k_listesi:\n        print(f\"\\n== {k} dogrulama ==\")\n        tr, va = gelistirme[gelistirme.altkume != k], gelistirme[gelistirme.altkume == k]\n        model, ep, _ = egit(tr, va, a, cihaz); epoklar.append(ep); model.eval()\n        for r in va.itertuples():\n            pr = tahmin(model, r.goruntu, a.boyut, cihaz)\n            Image.fromarray(pr * 255).save(os.path.join(a.cikti, \"tahmin_maske\", os.path.splitext(r.dosya)[0] + \".png\"))\n            satirlar.append(dict(file=r.dosya, set=\"cv\", fold=k.replace(\"fold\", \"\"), **metrikler(maske_oku(r.maske), pr, a.pxmm)))\n            olcumler.append(dict(file=r.dosya, **taraf_olcumleri(pr, gri_oku(r.goruntu), a.pxmm)))\n\n    # 2) nihai model: tum gelistirme verisi, CV'deki medyan en iyi epoch kadar\n    if len(test):\n        n_ep = int(np.median(epoklar)) if epoklar else a.epoch\n        print(f\"\\n== nihai model ({n_ep} epoch), bagimsiz test ==\")\n        model, _, _ = egit(gelistirme, None, a, cihaz, epoch_sabit=n_ep); model.eval()\n        torch.save(model.state_dict(), os.path.join(a.cikti, \"model_final.pt\"))\n        for r in test.itertuples():\n            pr = tahmin(model, r.goruntu, a.boyut, cihaz)\n            Image.fromarray(pr * 255).save(os.path.join(a.cikti, \"tahmin_maske\", os.path.splitext(r.dosya)[0] + \".png\"))\n            satirlar.append(dict(file=r.dosya, set=\"test\", fold=\"test\", **metrikler(maske_oku(r.maske), pr, a.pxmm)))\n            olcumler.append(dict(file=r.dosya, **taraf_olcumleri(pr, gri_oku(r.goruntu), a.pxmm)))\n\n    m = pd.DataFrame(satirlar); m.to_csv(os.path.join(a.cikti, \"segmentasyon_metrikleri.csv\"), index=False)\n    pd.DataFrame(olcumler).to_csv(os.path.join(a.cikti, \"otomatik_olcumler.csv\"), index=False)\n    for s in [\"cv\", \"test\"]:\n        t = m[m.set == s]\n        if len(t):\n            print(f\"{s}: \" + \"  \".join(f\"{c} {t[c].mean():.3f}+-{t[c].std():.3f}\" for c in [\"dice\", \"iou\", \"precision\", \"recall\", \"hd95\"]))\n\n    # 3) ogrenme egrisi: sabit dogrulama kati, artan bagimsiz katilimci sayisi\n    if a.ogrenme_egrisi:\n        sabit = k_listesi[0]; va = gelistirme[gelistirme.altkume == sabit]; havuz = gelistirme[gelistirme.altkume != sabit]\n        kodlar = list(havuz.kod.unique()); random.Random(a.seed).shuffle(kodlar); lc = []\n        for n in [int(x) for x in a.ogrenme_egrisi.split(\",\") if x.strip()]:\n            if n > len(kodlar):\n                print(f\"  {n} > havuz ({len(kodlar)}); atlandi\"); continue\n            tr = havuz[havuz.kod.isin(kodlar[:n])]\n            model, _, _ = egit(tr, va, a, cihaz); model.eval()\n            d = [metrikler(maske_oku(r.maske), tahmin(model, r.goruntu, a.boyut, cihaz))[\"dice\"] for r in va.itertuples()]\n            lc.append(dict(n=n, dice=float(np.mean(d)), sd=float(np.std(d, ddof=1)) if len(d) > 1 else 0.0)); print(\"  ogrenme egrisi\", lc[-1])\n        pd.DataFrame(lc).to_csv(os.path.join(a.cikti, \"ogrenme_egrisi.csv\"), index=False)\n    print(\"\\nBitti. Ciktilar:\", os.path.abspath(a.cikti))\n\n\nif __name__ == \"__main__\":\n    main()\n";
/* ===== İstatistik motoru (SPSS'siz) ===== */
const ST = (() => {
  const isNum = v => typeof v === 'number' && isFinite(v);
  const clean = a => a.filter(isNum);
  const sum = a => a.reduce((s, v) => s + v, 0);
  const mean = a => a.length ? sum(a) / a.length : NaN;
  const variance = a => { if (a.length < 2) return NaN; const m = mean(a); return sum(a.map(v => (v - m) ** 2)) / (a.length - 1); };
  const sd = a => Math.sqrt(variance(a));
  const sorted = a => [...a].sort((x, y) => x - y);
  function quantile(a, q) { // SPSS HAVERAGE (weighted average, type 6)
    const s = sorted(a), n = s.length; if (!n) return NaN;
    const h = (n + 1) * q; if (h <= 1) return s[0]; if (h >= n) return s[n - 1];
    const lo = Math.floor(h); return s[lo - 1] + (h - lo) * (s[lo] - s[lo - 1]);
  }
  const median = a => quantile(a, .5);

  // --- özel fonksiyonlar ---
  function lgamma(x) {
    const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
    x -= 1; let a = c[0]; const t = x + g + 0.5;
    for (let i = 1; i < 9; i++) a += c[i] / (x + i);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }
  function betacf(x, a, b) {
    const MAXIT = 300, EPS = 3e-14, FPMIN = 1e-300;
    let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < FPMIN) d = FPMIN; d = 1 / d; let h = d;
    for (let m = 1; m <= MAXIT; m++) {
      const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN; c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN; d = 1 / d;
      const del = d * c; h *= del; if (Math.abs(del - 1) < EPS) break;
    }
    return h;
  }
  function ibeta(x, a, b) { // regularized I_x(a,b)
    if (x <= 0) return 0; if (x >= 1) return 1;
    const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    return x < (a + 1) / (a + b + 2) ? bt * betacf(x, a, b) / a : 1 - bt * betacf(1 - x, b, a) / b;
  }
  function gammainc(a, x) { // regularized lower P(a,x)

function toCSV(rows, cols) { const esc = v => { if (v === null || v === undefined || (typeof v === 'number' && !isFinite(v))) return ''; if (typeof v === 'number') return String(+v.toFixed(6)); const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\r\n'); }
function parseCSV(txt) {
  const delim = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) { const c = txt[i]; if (q) { if (c === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; } else if (c === '"') q = true; else if (c === delim) { row.push(cur); cur = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c; }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift().map(s => s.trim().replace(/^﻿/, '')); return rows.filter(r => r.some(x => x.trim() !== '')).map(r => Object.fromEntries(head.map((k, i) => [k, (r[i] ?? '').trim()])));
}

ACT.mkFolds = () => {
  const ps = S.participants.filter(p => p.inF1 && p.durum !== 'uygun_degil'); const r = ST.rng(S.ayar.seed + '-fold');
  if (!S.folds) S.folds = { k: S.ayar.foldK || 5, testPct: S.ayar.testPct, seed: S.ayar.seed, created: today(), assign: {} };
  const F = S.folds;
  ['SAG', 'KBA'].forEach(g => {
    const todo = ST.shuffle(ps.filter(p => p.grup === g && F.assign[p.id] === undefined), r);
    const have = Object.entries(F.assign).filter(([id]) => (P(id) || {}).grup === g); const total = have.length + todo.length;
    let nTest = Math.round(total * F.testPct / 100) - have.filter(([, v]) => v === 'test').length;
    todo.forEach(p => { if (nTest > 0) { F.assign[p.id] = 'test'; nTest--; return; } const c = {}; Object.entries(F.assign).forEach(([id, v]) => { if (v !== 'test' && (P(id) || {}).grup === g) c[v] = (c[v] || 0) + 1; }); let best = 1; for (let i = 1; i <= F.k; i++) if ((c[i] || 0) < (c[best] || 0)) best = i; F.assign[p.id] = best; });

};

function projectContext() {
  const c = flowCounts(), ref = getRef(); const ag = [['csa', 'CSA'], ['mgv', 'MGV'], ['act', 'Aktivasyon']].map(([k, l]) => { const d = pairData(k, 'R1-AI', 'kat'); if (d.X.length < 3) return null; const ic = ST.icc(d.X.map((v, i) => [v, d.Y[i]])); return `${l}: ICC(2,1)=${f(ic.icc21, 3)} (n=${d.X.length})`; }).filter(Boolean).join('; ');
  return `PROJE: "Derin öğrenme tabanlı Lumbar Multifidus analiz sisteminin geliştirilmesi ve Kronik bel ağrısında fenotipe özgü egzersiz yaklaşımlarının etkinliği" (Hacettepe Üniv. FTR Fakültesi; sorumlu araştırmacı Prof. Dr. Sevil Bilgin, Doç. Dr. Cemil Zalluhoğlu, Fzt. Buse Buğra). Buse'nin yüksek lisans tezi Faz 1'dir; Faz 2 doktora için planlanmıştır.
TASARIM: Faz 1 – sağlıklı ve KBA bireyler (%50–%50), Clarius L7 HD3 ile L5–S1 transvers B-mod, kişi başı 15 görüntü (5 istirahat, 5+5 kontralateral kol kaldırma). İki değerlendirici ImageJ ile manuel segmentasyon (ground truth, binary maske). U-Net (ve U-Net++, Attention U-Net), Dice/BCE kaybı, Adam, erken durdurma, katılımcı düzeyinde 5-kat CV + bağımsız test. Örneklem: öğrenme eğrisi platosu. Metrikler: DSC (birincil), IoU, precision, recall, HD95; otomatik–manuel uyum ICC, Bland–Altman, MAE. CSA=piksel×(mm/piksel)²; MGV=ROI ortalama gri değer; aktivasyon=[(CSA kas−CSA ist)/CSA ist]×100. Fenotip: sağlıklı dağılıma göre ±1/2 SS; 0 etkilenim=referans, 1=F1/F2/F3, ≥2=F4 kombine. Faz 2 – fenotip içinde randomize egzersiz vs bel-boyun okulu, 8 hafta, hf 3 gün; değerlendirme 0/4/8. hf; VAS, ODI, CSA, MGV, aktivasyon; lineer karma model, grup×zaman. Her hücre 16 kişi (toplam 128).
H1: LM yüksek segmentasyon performansıyla otomatik segmente edilebilir. H2: otomatik CSA/MGV/aktivasyon manuel ölçümlerle yüksek uyumludur ve fenotiplemede kullanılabilir. H3: fenotipe özgü egzersiz sonrası hedef parametrelerde ve klinik sonuçlarda anlamlı iyileşme.

}
const CHAT_RULES = `Sen Buse'nin yüksek lisans tez asistanısın. Buse fizyoterapist, Hacettepe Üniversitesi Sağlık Bilimleri Enstitüsü'nde YL öğrencisi; istatistikte kendini güçlü hissetmiyor, bu yüzden açık ve öğretici ol. Türkçe yaz, kısa paragraflar ve gerektiğinde madde listesi kullan. Yalnızca aşağıdaki proje özetindeki sayıları kullan; sayı uydurma, eksik veri varsa söyle. Kaynak önerirken emin olmadığın künyeyi yazma; projede geçen kaynaklara (Lindsay ve ark., Belasso ve ark. 2020 LUMINOUS, Wesselink, Koo & Li 2016, TRIPOD+AI, CLAIM 2024) atıf yapabilirsin. Tez metnini onun yerine baştan sona yazma; yapı, sıra ve ifade önerileri ver, örnek cümleyi kısa tut. Danışmanı Prof. Dr. Sevil Bilgin'in kararlarına saygılı ol; yöntem değişikliği önerirken etik kurul onayını hatırlat.\n\n`;

async function askClaude(qtext) {

  chatCtl = new AbortController();
  try { const { text } = await CAP.sample(msgs, { cache: false, signal: chatCtl.signal, onText: ({ text }) => { const l = document.getElementById('chatLive'); if (l) l.textContent = text; } }); S.chat.push({ role: 'assistant', content: text }); }
  catch (e) { const msg = { not_granted: 'Claude kullanımına izin verilmedi.', rate_limited: 'Şu an çok fazla istek var ya da kullanım sınırına ulaşıldı; biraz sonra tekrar dene.', sampling_disabled: 'Claude bu hesapta kullanılamıyor.', cancelled: '' }[e.code] ?? 'Bir sorun oldu; tekrar deneyebilirsin.'; if (e.text) S.chat.push({ role: 'assistant', content: e.text + '\n[yarıda kesildi]' }); if (msg) toast(msg); }
  save(); render(); const cb = document.getElementById('chatBox'); if (cb) cb.scrollTop = cb.scrollHeight;
}

        if (rt === 'R1') ['ist', 'kolSag', 'kolSol'].forEach(c => { const n = L.filter(i => i.cond === c).length; if (n !== 5) add(n < 3 ? 'hata' : 'uyari', p, lab, `${COND[c]}: ${n}/5 görüntü`); });

          else { if (pn.code !== p.code) add('hata', p, lab, `${i.file}: kod ${pn.code}, katılımcı ${p.code}`); if (pn.tp !== tp) add('hata', p, lab, `${i.file}: adda ${pn.tp}, kayıtta ${tp}`); if (pn.cond !== i.cond) add('hata', p, lab, `${i.file}: adda ${pn.cond}, kayıtta ${i.cond}`); }

  const ok = a && !a.viol.length && !a.missing.length && !a.unused.length && !a.authorYear.length;
  return `<div class="card"><h3>Atıf denetimi</h3><p class="small">Tez ya da başvuru dosyanı (.docx) yükle ya da metni yapıştır. Uygulama metindeki numaralı atıfları okur ve kurullardan en sık gelen düzeltmeleri kontrol eder: ilk geçiş sırası, listede olmayan numara, hiç atıf almayan kaynak, kalmış yazar–yıl atıfları, numarasız "ve ark." ifadeleri ve Vancouver biçimi.</p>
  <div class="row"><button class="btn p" data-act="audDocx">⇧ .docx yükle</button><button class="btn" data-act="audPaste">Metin yapıştır</button>${AUD.text ? `<span class="small muted">${h(AUD.file || 'yapıştırılan metin')} · ${a.cites.length} atıf · ${N} kaynak ${AUD.listFromDoc.length ? '(dosyadaki listeden)' : '(uygulamadaki listeden)'}</span>` : ''}${AUD.listFromDoc.length ? `<span class="sp"></span><button class="btn sm" data-act="audImport">Dosyadaki ${AUD.listFromDoc.length} kaynağı Kaynakça'ya aktar</button>` : ''}</div></div>
  ${a ? `<div class="grid g4" style="margin-bottom:14px">${[['Sıra hatası', a.viol.length], ['Listede olmayan numara', a.missing.length], ['Atıf almayan kaynak', a.unused.length], ['Kalan yazar–yıl atfı', a.authorYear.length]].map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v" style="color:${v ? 'var(--bad)' : 'var(--ok)'}">${v}</div></div>`).join('')}</div>
  ${a.atlanan.length ? `<div class="note w">Belgenin başında (1) numaralı atıftan önce ${a.atlanan.length} atıf var — örneğin düzeltme yazısı ya da özet. Sıra denetimi (1)'in ilk geçtiği yerden başlatıldı. Bu kısım tez metninin parçasıysa oradaki numaralar da sıra hatasıdır: ${a.atlanan.slice(0, 3).map(c => `<i>…${h(c.ctx.slice(-50))}</i>`).join(', ')}</div>` : ''}${ok ? '<div class="note">Numaralandırma tutarlı: kaynaklar metinde ilk geçiş sırasına göre numaralanmış, eksik ya da fazla kaynak yok. 👏</div>' : ''}
  ${a.viol.length ? `<div class="card"><h3>İlk geçiş sırası bozuk</h3><p class="small">Vancouver'da kaynak numarası, metinde ilk kez geçtiği sıradır. Aşağıdaki yerlerde beklenen numara yerine başka bir numara ilk kez kullanılmış.</p>${tableHTML(['Kullanılan', 'Beklenen', 'Bağlam'], a.viol.slice(0, 40).map(v => `<tr><td class="n"><b>${v.n}</b></td><td class="n">${v.beklenen}</td><td class="small">…${h(v.ctx)}…</td></tr>`))}<div class="row" style="margin-top:8px"><button class="btn sm" data-act="audMap">Yeniden numaralandırma tablosu</button></div></div>` : ''}
  ${a.missing.length ? `<div class="note b">Metinde geçen ama listede olmayan numaralar: <b>${a.missing.join(', ')}</b></div>` : ''}
  ${a.unused.length ? `<div class="note w">Listede olup metinde hiç atıf almayan kaynaklar: <b>${a.unused.join(', ')}</b> — ya metinde ilgili yere ekle ya da listeden çıkar (numaralar kayar).</div>` : ''}
  ${a.authorYear.length ? `<div class="card"><h3>Yazar–yıl biçiminde kalan atıflar</h3>${a.authorYear.slice(0, 30).map(x => `<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line2)">…${h(x)}</div>`).join('')}</div>` : ''}
  ${a.veArk.length ? `<div class="card"><h3>Numarası olmayan "ve ark." ifadeleri</h3><p class="small">Metinde yazar adı geçen cümlelerde de numara verilmeli: "Lindsay ve ark. (22)…"</p>${a.veArk.slice(0, 20).map(x => `<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line2)">${h(x)}…</div>`).join('')}</div>` : ''}` : ''}
  <div class="card"><h3>Vancouver biçim denetimi ${listForFmt.length ? `(${listForFmt.length} kaynak)` : ''}</h3>${!listForFmt.length ? '<p class="muted small">Liste yok.</p>' : fmtIss.length ? tableHTML(['No', 'Kaynak', 'Sorun'], fmtIss.map(([i, x]) => `<tr><td class="n"><b>${i + 1}</b></td><td class="small" style="max-width:420px">${h((listForFmt[i].ham || stripTags(fmtRef(listForFmt[i], 'vancouver'))).slice(0, 160))}…</td><td class="small">${x.map(h).join('<br>')}</td></tr>`)) : '<div class="note">Biçim sorunu bulunmadı.</div>'}
  <p class="small muted" style="margin-top:8px">Biçim denetimi yazım kurallarına bakar; yazar, yıl ve sayfa bilgisinin makaleyle gerçekten uyuştuğunu doğrulamaz. Şüpheli kaynakları PubMed'de PMID ile açıp karşılaştır ya da .nbib olarak yeniden içe aktar.</p></div>`;
}
ACT.audDocx = () => pickFile('.docx', async fl => { try { const t = await docxText(fl); const { body, refs } = splitBodyRefs(t); AUD.text = body; AUD.file = fl.name; AUD.listFromDoc = refs ? parseNumberedList(refs) : []; render(); } catch (e) { toast(e.message === 'zip' ? 'ZIP kütüphanesi yüklenemedi (internet gerekli); metni yapıştırarak dene.' : 'Dosya okunamadı.'); } });

ACT.kNumList = () => modal('<h3>Numaralı kaynak listesi yapıştır</h3><p class="small muted">Word\'deki "Kaynaklar" listesini olduğu gibi yapıştır (1. Yazar AB, …). Sıra korunur.</p><textarea id="nl" style="width:100%;height:260px"></textarea>', m => { const L = parseNumberedList(m.querySelector('#nl').value); if (!L.length) { toast('Numaralı satır bulunamadı.'); return false; } addRefs(L); }, 'Aktar');

// ---------- GOOGLE DRIVE SENKRONİZASYONU ----------
// Google Identity Services (token modeli) + Drive v3, kapsam: drive.file
// Uygulama yalnızca kendi oluşturduğu dosyaları görür: "Multifidus Tez Asistanı" klasörü,
// içinde ana veri dosyası ve günlük yedekler.
const DRV = { token: null, exp: 0, folder: null, file: null, busy: false, timer: null, err: '', gsi: null, client: null, clientId: null, pending: null };
const DRV_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRV_FOLDER = 'Multifidus Tez Asistanı';
const DRV_MAIN = 'multifidus_tez_veri.json';
const DRV_KEY = 'lmTezAsistani.drive';

const DRV_DEFAULT_CID = '903526658419-qb7ej2m8nutc9t0jvr4edt2u6blanciu.apps.googleusercontent.com';
function drvCfg() { let c = {}; try { c = JSON.parse(localStorage.getItem(DRV_KEY) || '{}'); } catch (e) { } if (!c.clientId) c.clientId = DRV_DEFAULT_CID; return c; }
function drvSetCfg(o) { const c = Object.assign(drvCfg(), o); try { localStorage.setItem(DRV_KEY, JSON.stringify(c)); } catch (e) { } return c; }
function drvOrigin() { return location.protocol.startsWith('http') ? location.origin : '(dosyadan açıldı – GitHub Pages adresinden aç)'; }
function drvOk() { return DRV.token && Date.now() < DRV.exp - 60000; }

function drvLoadGsi() {
  if (DRV.gsi) return DRV.gsi;
  DRV.gsi = new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => { DRV.gsi = null; rej(new Error('Google oturum betiği yüklenemedi (internet ya da tarayıcı engeli).')); };
    document.head.appendChild(s);
  });
  return DRV.gsi;
}

// Kullanıcı tıklamasıyla çağrılmalı (açılır pencere engeline takılmamak için)
async function drvConnect(silent) {
  const cid = (drvCfg().clientId || '').trim();
  if (!cid) throw new Error('Önce OAuth istemci kimliğini (Client ID) gir.');
  await drvLoadGsi();
  if (!DRV.client || DRV.clientId !== cid) {
    DRV.clientId = cid;
    DRV.client = google.accounts.oauth2.initTokenClient({
      client_id: cid, scope: DRV_SCOPE,
      callback: r => { const p = DRV.pending; DRV.pending = null; if (!p) return; if (r.error) p.rej(new Error(r.error_description || r.error)); else { DRV.token = r.access_token; DRV.exp = Date.now() + (r.expires_in || 3600) * 1000; drvSetCfg({ bagli: true, hint: true }); p.res(); } },
      error_callback: e => { const p = DRV.pending; DRV.pending = null; if (p) p.rej(new Error(e && e.type === 'popup_closed' ? 'Google penceresi kapatıldı.' : e && e.type === 'popup_failed_to_open' ? 'Açılır pencere engellendi; tarayıcıda bu siteye açılır pencere izni ver.' : 'Google girişi tamamlanmadı.')); }
    });
  }
  return new Promise((res, rej) => { DRV.pending = { res, rej }; DRV.client.requestAccessToken({ prompt: silent ? '' : (drvCfg().hint ? '' : 'consent') }); });
}

async function drvFetch(url, opt = {}) {
  if (!drvOk()) throw new Error('Drive oturumu süresi doldu. "Drive\'a bağlan" ile yenile.');
  const r = await fetch(url, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + DRV.token }, opt.headers || {}) }));
  if (r.status === 401) { DRV.token = null; throw new Error('Drive oturumu sona erdi. Yeniden bağlan.'); }
  if (!r.ok) { let m = r.status + ''; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (e) { } throw new Error('Drive hatası: ' + m); }
  return r;
}
const DQ = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
async function drvFind(q) {
  const r = await drvFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name,modifiedTime,size)&orderBy=modifiedTime desc&pageSize=100&q=' + encodeURIComponent(q));
  return (await r.json()).files || [];
}
async function drvFolder() {
  if (DRV.folder) return DRV.folder;
  const f = await drvFind(`name='${DQ(DRV_FOLDER)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  if (f.length) return (DRV.folder = f[0].id);
  const r = await drvFetch('https://www.googleapis.com/drive/v3/files?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRV_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) });
  return (DRV.folder = (await r.json()).id);
}
async function drvUpload(name, text, fileId) {
  const folder = await drvFolder();
  if (fileId) {
    await drvFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: text });
    return fileId;
  }
  const b = 'mtb' + Math.random().toString(36).slice(2);
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name, parents: [folder], mimeType: 'application/json' })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${text}\r\n--${b}--`;
  const r = await drvFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
  return (await r.json()).id;
}
async function drvFiles() {
  const folder = await drvFolder();
  return drvFind(`'${folder}' in parents and trashed=false and mimeType='application/json'`);
}

async function drvSave(manual) {
  if (DRV.busy) return; DRV.busy = true; DRV.err = '';
  try {
    if (!drvOk()) { if (!manual) throw new Error('oturum yok'); await drvConnect(true); }
    const text = JSON.stringify(S);
    const files = await drvFiles();
    const main = files.find(f => f.name === DRV_MAIN);
    await drvUpload(DRV_MAIN, text, main && main.id);
    const day = 'yedek_' + today() + '.json';
    const snap = files.find(f => f.name === day);
    await drvUpload(day, text, snap && snap.id);
    const now = new Date().toISOString();
    drvSetCfg({ son: now });
    S.ayar.sonYedek = now; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
    if (manual) toast('Drive\'a kaydedildi');
  } catch (e) { DRV.err = e.message; if (manual) toast(e.message); }
  DRV.busy = false;
  if (location.hash.startsWith('#ayarlar')) render();
  drvBadge();
}

// Otomatik kayıt: değişiklikten 15 sn sonra, oturum açıksa
function drvSchedule() {
  if (!drvCfg().oto || !drvOk()) { drvBadge(); return; }
  clearTimeout(DRV.timer); DRV.timer = setTimeout(() => drvSave(false), 15000); drvBadge('bekliyor');
}
(function () { const _s = save; save = function () { _s(); try { drvSchedule(); } catch (e) { } }; })();

function drvBadge(state) {
  let el = document.getElementById('drvBadge');
  const c = drvCfg(); if (!c.clientId) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('a'); el.id = 'drvBadge'; el.href = '#ayarlar'; el.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:50;font:500 12px "IBM Plex Sans",sans-serif;padding:6px 10px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12)'; document.body.appendChild(el); }
  const ok = drvOk();
  const txt = DRV.busy ? 'Drive: kaydediliyor…' : DRV.err ? 'Drive: hata' : state === 'bekliyor' ? 'Drive: kaydedilecek' : ok ? 'Drive: bağlı' + (c.son ? ' · ' + new Date(c.son).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '') : 'Drive: bağlı değil';
  el.textContent = '☁ ' + txt;
  el.style.background = DRV.err ? '#f6dcd6' : ok ? '#dcebe7' : '#efe9dd'; el.style.color = DRV.err ? '#8a2b1a' : ok ? '#1f5f63' : '#6b5a3a';
}
window.addEventListener('beforeunload', e => { if (DRV.timer && drvCfg().oto && drvOk()) { e.preventDefault(); e.returnValue = ''; } });

ACT.drvCid = el => { drvSetCfg({ clientId: el.value.trim() }); DRV.client = null; render(); };
ACT.drvOto = el => { drvSetCfg({ oto: el.checked }); render(); };
ACT.drvBaglan = async () => { try { await drvConnect(false); DRV.err = ''; toast('Drive\'a bağlandı'); } catch (e) { DRV.err = e.message; toast(e.message); } render(); drvBadge(); };
ACT.drvKaydet = () => drvSave(true);
ACT.drvKes = () => { if (DRV.token && window.google) try { google.accounts.oauth2.revoke(DRV.token, () => { }); } catch (e) { } DRV.token = null; DRV.folder = null; drvSetCfg({ bagli: false, hint: false }); render(); drvBadge(); };
ACT.drvYukle = async () => {
  try {
    if (!drvOk()) await drvConnect(true);
    const files = (await drvFiles()).sort((a, b) => a.name === DRV_MAIN ? -1 : b.name === DRV_MAIN ? 1 : b.name.localeCompare(a.name));
    if (!files.length) return toast('Drive klasöründe henüz yedek yok.');
    modal(`<h3>Drive'dan yükle</h3><p class="small">"${h(DRV_FOLDER)}" klasöründeki kayıtlar. Seçtiğin kayıt bu tarayıcıdaki verilerin yerine geçer.</p>
      <div class="form"><label class="f">Kayıt<select id="drvSel">${files.map(f => `<option value="${f.id}">${f.name === DRV_MAIN ? 'En güncel veri' : h(f.name.replace('yedek_', 'Günlük yedek · ').replace('.json', ''))} — ${new Date(f.modifiedTime).toLocaleString('tr-TR')}</option>`).join('')}</select></label></div>`, async m => {
      const id = m.querySelector('#drvSel').value;
      try {
        const d = JSON.parse(await (await drvFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text());
        if (!d.participants) throw new Error('Bu dosya geçerli bir yedek değil.');
        confirmBox(`Drive kaydında ${d.participants.length} katılımcı var. Bu tarayıcıdaki veriler bununla değiştirilecek.`, () => { S = d; const def = defaults(); S.ayar = Object.assign(def.ayar, S.ayar); for (const k of Object.keys(def)) if (S[k] === undefined) S[k] = def[k]; clearTimeout(DRV.timer); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } toast('Drive\'dan yüklendi'); render(); }, 'Yükle');
      } catch (e) { toast(e.message); }
    }, 'Yükle');
  } catch (e) { toast(e.message); }
};

function driveCard() {
  const c = drvCfg(), ok = drvOk(), org = drvOrigin();
  return `<div class="card" style="border-color:#1f5f63"><h3>Google Drive senkronizasyonu</h3>
  <p class="small">Verilerin Drive'ında <b>${h(DRV_FOLDER)}</b> klasörüne kaydedilir: güncel veri + her gün için bir yedek. Uygulama Drive'ında yalnızca kendi oluşturduğu dosyaları görebilir, diğer dosyalarına erişemez.</p>
  <div class="form"><label class="f" style="grid-column:1/-1">OAuth istemci kimliği (Client ID)<input data-chg="drvCid" value="${h(c.clientId || '')}" placeholder="…apps.googleusercontent.com" spellcheck="false"></label></div>
  <div class="row" style="margin-top:10px">
   <button class="btn p" data-act="drvBaglan" ${c.clientId ? '' : 'disabled'}>${ok ? '↻ Bağlantıyı yenile' : '☁ Drive\'a bağlan'}</button>
   <button class="btn" data-act="drvKaydet" ${c.clientId ? '' : 'disabled'}>⇧ Şimdi Drive'a kaydet</button>
   <button class="btn" data-act="drvYukle" ${c.clientId ? '' : 'disabled'}>⇩ Drive'dan yükle</button>
   ${ok ? '<button class="btn d sm" data-act="drvKes">Bağlantıyı kes</button>' : ''}</div>
  <label class="chk"><input type="checkbox" data-chg="drvOto" ${c.oto ? 'checked' : ''}> Değişikliklerden 15 saniye sonra otomatik kaydet (oturum açıkken)</label>
  <p class="small muted">Durum: ${DRV.busy ? 'kaydediliyor…' : ok ? 'bağlı' : 'bağlı değil'}${c.son ? ' · son Drive kaydı: ' + new Date(c.son).toLocaleString('tr-TR') : ''}${DRV.err ? ` · <span style="color:#8a2b1a">${h(DRV.err)}</span>` : ''}</p>
  <div class="note small">Google oturumu güvenlik gereği yaklaşık 1 saat sürer. Süre dolunca otomatik kayıt durur, sağ alttaki rozet "bağlı değil" olur; "Drive'a bağlan"a bir kez basman yeter.</div>
  <details style="margin-top:10px"><summary class="small"><b>Client ID nasıl alınır? (bir kez)</b></summary><ol class="steps small">
   <li><a href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener">console.cloud.google.com</a> adresinde yeni proje oluştur (ad: Multifidus Tez).</li>
   <li><b>APIs & Services › Library</b>: "Google Drive API" ara, <b>Enable</b>.</li>
   <li><b>Google Auth Platform › Branding</b> (OAuth consent screen): uygulama adı ve e-postanı gir, kitle <b>External</b>. <b>Audience</b> bölümünde kendi Gmail adresini <b>Test users</b> olarak ekle.</li>
   <li><b>Clients › Create client</b>: tür <b>Web application</b>. <b>Authorized JavaScript origins</b> alanına tam olarak şunu yaz: <span class="mono">${h(org)}</span></li>
   <li>Oluşan <span class="mono">…apps.googleusercontent.com</span> ile biten kimliği kopyalayıp yukarıdaki kutuya yapıştır, "Drive'a bağlan"a bas.</li>
   <li>Google "doğrulanmamış uygulama" uyarısı gösterirse: <b>Gelişmiş › Multifidus Tez'e git</b>. Uygulamayı yalnızca sen kullandığın için bu normaldir.</li></ol></details></div>`;
}
setTimeout(() => drvBadge(), 0);
